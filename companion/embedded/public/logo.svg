<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">LinkPi Companion</title>
  <desc id="desc">Two camera sources merge into one program output</desc>
  <defs>
