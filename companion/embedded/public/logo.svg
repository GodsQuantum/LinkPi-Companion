      <stop stop-color="#63f2e9"/><stop offset="1" stop-color="#18a7ff"/>
    </linearGradient>
    <linearGradient id="program" x1="294" y1="196" x2="424" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7cf5ff"/><stop offset=".55" stop-color="#5aa8ff"/><stop offset="1" stop-color="#9d78ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="#081018"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="110.5" fill="none" stroke="#233343" stroke-width="3"/>
