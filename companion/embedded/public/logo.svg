    <rect x="86" y="118" width="116" height="82" rx="20"/><rect x="86" y="312" width="116" height="82" rx="20"/>
    <path d="M202 159H236C275 159 274 225 312 238"/><path d="M202 353H236C275 353 274 287 312 274"/>
  </g>
  <g fill="#dffbff" font-family="Inter,Segoe UI,sans-serif" font-size="42" font-weight="800" text-anchor="middle"><text x="144" y="174">A</text><text x="144" y="368">B</text></g>
  <path d="M300 186C300 169 319 159 333 169L426 237C439 246 439 266 426 275L333 343C319 353 300 343 300 326V186Z" fill="url(#program)" filter="url(#glow)"/>
  <circle cx="422" cy="110" r="8" fill="#63f2e9"/><circle cx="445" cy="110" r="8" fill="#3bc8ff"/><circle cx="468" cy="110" r="8" fill="#9d78ff"/>
