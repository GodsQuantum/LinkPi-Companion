name: Feature request
description: Suggest a simple, useful LinkPi Companion improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What is difficult or repetitive today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Prefer a simple user flow over implementation details.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Guide, Auto Director, Recording, Streaming, Diagnostics, Installer, Other]
    validations:
      required: true
